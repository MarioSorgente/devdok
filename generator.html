<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevDok - Code Documentation Generator</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Minimal Inline CSS -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      color: #2d3436;
    }
    .navbar-logo { height: 32px; }
    .d-none { display: none !important; }
    .loading-spinner {
      display: inline-block;
      width: 1.25rem;
      height: 1.25rem;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #28a745;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn-outline-primary.active {
      background-color: #28a745 !important;
      border-color: #28a745 !important;
      color: #fff !important;
    }
  </style>
</head>
<body>
  <!-- Navbar (static, optional) -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="duck.png" alt="DevDok Logo" class="navbar-logo">
        <span class="ml-2 font-weight-bold text-primary">DevDok</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="mb-4 text-dark">Code Documentation Generator</h2>

        <form id="doc-form">
          <!-- Input Method -->
          <div class="form-group">
            <label class="font-weight-bold">Input Method</label>
            <div class="btn-group btn-group-toggle w-100" data-toggle="buttons">
              <label class="btn btn-outline-primary active" id="codeSnippetLabel">
                <input type="radio" name="inputMethod" id="codeSnippetOption" value="codeSnippet" checked>
                <i class="fas fa-code mr-1"></i>Code Snippet
              </label>
              <label class="btn btn-outline-primary" id="githubFileLabel">
                <input type="radio" name="inputMethod" id="githubFileOption" value="githubFile">
                <i class="fab fa-github mr-1"></i>GitHub File
              </label>
            </div>
          </div>

          <!-- Code Snippet Container -->
          <div id="codeSnippetInput">
            <div class="form-group">
              <label class="font-weight-bold">Your Code</label>
              <textarea class="form-control" id="code" rows="8" placeholder="Paste your code here..." required></textarea>
            </div>
          </div>

          <!-- GitHub File Container -->
          <div id="githubFileInput" class="d-none">
            <div class="form-group">
              <label class="font-weight-bold">GitHub File URL</label>
              <input type="url" class="form-control" id="githubFileUrl" placeholder="https://github.com/username/repo/blob/main/file.js">
              <small class="form-text text-muted">Ensure file size is under 50KB</small>
            </div>
          </div>

          <!-- Additional Context -->
          <div class="form-group mt-3">
            <label class="font-weight-bold">Additional Context</label>
            <textarea class="form-control" id="jira" rows="3" placeholder="Any special instructions here..."></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-success btn-block mt-4">
            <i class="fas fa-magic mr-1"></i>Generate Documentation
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Documentation Modal -->
  <div class="modal fade" id="outputModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header bg-light">
          <h5 class="modal-title">Generated Documentation</h5>
          <button type="button" class="close" data-dismiss="modal">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="row">
            <!-- Markdown Column -->
            <div class="col-md-6 mb-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6>Markdown Format</h6>
                <button class="btn btn-sm btn-outline-secondary" id="copyMarkdownButton">
                  <i class="far fa-copy mr-1"></i>Copy
                </button>
              </div>
              <pre id="markdownContent" class="bg-light p-3 border rounded" style="min-height:200px;"></pre>
            </div>
            <!-- Rendered Preview Column -->
            <div class="col-md-6 mb-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6>Rendered Preview</h6>
                <button class="btn btn-sm btn-outline-secondary" id="copyRenderedButton">
                  <i class="far fa-copy mr-1"></i>Copy
                </button>
              </div>
              <div id="renderedContent" class="bg-white p-3 border rounded" style="min-height:200px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Inline Script -->
  <script>
    // Toggle logic: show Code snippet or GitHub File input
    function toggleInputFields() {
      const codeSnippetInput = document.getElementById("codeSnippetInput");
      const githubFileInput = document.getElementById("githubFileInput");
      const codeSnippetChecked = document.getElementById("codeSnippetOption").checked;

      if (codeSnippetChecked) {
        codeSnippetInput.classList.remove("d-none");
        githubFileInput.classList.add("d-none");
      } else {
        githubFileInput.classList.remove("d-none");
        codeSnippetInput.classList.add("d-none");
      }
    }

    // Show an error alert
    function showError(message) {
      alert(message);
    }

    // Copy the raw Markdown text
    function copyMarkdown() {
      const markdownText = document.getElementById('markdownContent').textContent;
      navigator.clipboard.writeText(markdownText).then(() => {
        alert("Markdown content copied!");
      }).catch(err => {
        alert("Error copying: " + err);
      });
    }

    // Copy the rendered text
    function copyRendered() {
      const renderedText = document.getElementById('renderedContent').innerText;
      navigator.clipboard.writeText(renderedText).then(() => {
        alert("Rendered content copied!");
      }).catch(err => {
        alert("Error copying rendered content: " + err);
      });
    }

    // Handle form submission: POST to /api/generate-doc
    async function handleSubmit(e) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');

      try {
        // Gather form data
        const code = document.getElementById('code').value.trim();
        const jira = document.getElementById('jira').value.trim();
        const githubFileUrl = document.getElementById('githubFileUrl').value.trim();
        const inputMethod = document.querySelector('input[name="inputMethod"]:checked').value;

        // Validate
        if (inputMethod === 'codeSnippet' && !code) {
          throw new Error("Please enter code!");
        }
        if (inputMethod === 'githubFile' && !githubFileUrl) {
          throw new Error("GitHub URL required!");
        }

        // Show spinner
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="loading-spinner"></div> Generating...';

        // Send request
        const response = await fetch('/api/generate-doc', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, jira, githubFileUrl, inputMethod })
        });

        let result;
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          result = await response.json();
        } else {
          const text = await response.text();
          throw new Error("Non-JSON response: " + text);
        }

        if (result.error) {
          throw new Error(result.error);
        }

        // Display the returned docs
        document.getElementById('markdownContent').textContent = result.documentation;
        document.getElementById('renderedContent').innerHTML = marked.parse(result.documentation);
        $('#outputModal').modal('show');

      } catch (err) {
        showError("Error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-magic mr-1"></i>Generate Documentation';
      }
    }

    // Set up event listeners
    function initApp() {
      // Toggle fields when changing radio
      document.querySelectorAll('input[name="inputMethod"]').forEach(radio => {
        radio.addEventListener('change', toggleInputFields);
      });
      // Kick off initial toggle
      toggleInputFields();

      // Form submit
      document.getElementById('doc-form').addEventListener('submit', handleSubmit);

      // Copy buttons
      document.getElementById('copyMarkdownButton').addEventListener('click', copyMarkdown);
      document.getElementById('copyRenderedButton').addEventListener('click', copyRendered);
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
